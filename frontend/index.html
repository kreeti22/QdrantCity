<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Discover movies, events, night activities and local routes with on-device edge intelligence" />
  <title>QdrantCity — Offline Movies, Events & Location Locator</title>
  <link rel="icon" type="image/png" href="./assets/logo.png" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css" />
  <script src="./vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { DiscoveryPage } from "./pages/DiscoveryPage.js";

    document.addEventListener("DOMContentLoaded", () => {
      const appEl = document.getElementById("app");
      if (appEl) {
        new DiscoveryPage({ rootElement: appEl });
      }
    });
  </script>
</body>
</html>
