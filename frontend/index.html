<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Book movies, events, concerts and plays with local intelligence" />
  <title>QdrantCinema — Movies, Events, Concerts & Plays</title>
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { DiscoveryPage } from "./pages/DiscoveryPage.js";

    document.addEventListener("DOMContentLoaded", () => {
      const appEl = document.getElementById("app");
      if (appEl) {
        new DiscoveryPage({ rootElement: appEl });
      }
    });
  </script>
</body>
</html>
